  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden}
body{display:flex;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));font:400 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.frame{flex:1;min-width:0;min-height:0;margin:var(--inset);display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--edge);border-radius:0}
.bar{display:grid;min-width:0}
.bar > *{padding:var(--f3);min-width:0;white-space:nowrap;overflow:hidden}
.head{grid-template-columns:auto 1fr auto;border-bottom:1px solid var(--rule)}
.foot{grid-template-columns:repeat(4, auto) 1fr;border-top:1px solid var(--rule)}
.bar > * + *{border-left:1px solid var(--rule)}
.foot > *{display:grid;gap:var(--f1);align-content:end}
.foot b{font-weight:400}
.foot > .ticker{text-align:right;text-transform:none}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;touch-action:none;outline:0}
.stage:focus-visible{outline:1px solid var(--ink);outline-offset:-1px}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 2fr 3fr 5fr 8fr;pointer-events:none}
.cols i{border-right:1px solid var(--grid)}
.cols i:last-child{border-right:0}
.lung{position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--ink);transform:scaleX(var(--b));transform-origin:0 0}
.phrase{position:relative;margin:0;font-family:var(--display);font-weight:900;font-size:var(--fs);line-height:var(--lh);font-variation-settings:"wdth" var(--wdth);letter-spacing:calc(var(--track) * 1em);text-transform:uppercase}
.row{display:block;border-top:1px solid var(--rule);padding-inline:var(--f3);white-space:nowrap}
.row span{display:inline-block;transform:translate3d(0, calc(var(--sink, 0) * 0.06em), 0)}
@media (min-width:1024px){.row{padding-inline:var(--f4)}}
@media (max-width:640px){
  .head{grid-template-columns:auto 1fr}
  .head .mid{display:none}
  .head .hint{text-align:right}
  .foot{grid-template-columns:repeat(4, 1fr)}
  .foot > .ticker{grid-column:1 / -1;border-left:0;border-top:1px solid var(--rule);text-align:left}
}

.head a{color:inherit;text-decoration:none}
.head a:focus-visible{outline:1px solid var(--ink);outline-offset:-4px}
</style>
</head><body>
<main class="frame">
  <header class="bar head">
    <a href="https://wildlakestudio.com/">Wild-Lake</a>
    <span class="mid">Somatic down-regulation</span>
    <span class="hint" id="hint">Rest a hand on the field</span>
  </header>
  <section class="stage" id="stage" tabindex="0" aria-label="Breath field. Hover, touch, or hold Space or Enter to rest a hand on it and slow the breath.">
    <div class="cols" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1 class="phrase" id="phrase" aria-label="Come home to your body"><span class="row" aria-hidden="true"><span>Come</span></span><span class="row" aria-hidden="true"><span>home</span></span><span class="row" aria-hidden="true"><span>to your</span></span><span class="row" aria-hidden="true"><span>body</span></span></h1>
    <div class="lung" aria-hidden="true"></div>
  </section>
  <footer class="bar foot" aria-hidden="true">
    <span><b>Breath</b><span id="o-breath">--</span></span>
    <span><b>Phase</b><span id="o-phase">Rest</span></span>
    <span><b>Load</b><span id="o-load">0.00</span></span>
    <span><b>Frame</b><span id="o-frame">Still</span></span>
    <span class="ticker" id="o-ticker">[STATE: UNCLENCHED // FREQ: 0.16Hz]</span>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const phrase = document.getElementById('phrase');
  const out = {};
  for (const k of ['breath', 'phase', 'load', 'frame', 'ticker']) out[k] = document.getElementById('o-' + k);

  const WORDS = ['Come', 'home', 'to', 'your', 'body'];
  const LAYOUTS = [[5], [2, 3], [2, 2, 1], [1, 1, 2, 1], [1, 1, 1, 1, 1]]; // words per line

  // Breath model. Tension t runs 1 -> 0, clenched to unclenched, and never climbs back.
  const P_CLENCHED = 4.0;  // s per breath at open, 0.25 Hz
  const P_RESONANT = 6.25; // s per breath at baseline, 0.16 Hz
  const RELEASE = 9;       // s, e-folding time of the release
  const HAND_W = 1.1;      // rad/s, critically damped: a hand lands and lifts with no rebound
  const HAND_TEMPO = 0.55; // a resting hand slows the breath by up to 55% and doubles the release
  const PEAK = { wdth: 125, track: -0.005, lh: 0.96 }; // fullest inhale; the fit is sized for it
  const REST = { wdth: 125, track: -0.04, lh: 0.9 };   // reduced motion: Expanded Black, still

  const s = { t: 1, phase: 0, breaths: 1, frame: 0, load: 0, vel: 0, hand: 0, aim: 0.5, y: 0.5 };
  let spans = [], key = '';

  const lerp = (a, b, x) => a + (b - a) * x;
  const ease = (x) => (1 - Math.cos(Math.PI * x)) / 2;
  const pad = (n, w) => String(n).padStart(w, '0');
  const put = (el, v) => { if (el.textContent !== v) el.textContent = v; };

  const lines = (layout) => {
    let i = 0;
    return layout.map((n) => WORDS.slice(i, (i += n)).join(' '));
  };

  const meas = document.createElement('span');
  meas.setAttribute('aria-hidden', 'true');
  meas.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;font-family:var(--display);font-weight:900;font-size:100px;text-transform:uppercase;'
    + `font-variation-settings:"wdth" ${PEAK.wdth};letter-spacing:${PEAK.track}em`;
  document.body.appendChild(meas);

  function fit() {
    const row = phrase.querySelector('.row');
    const cs = getComputedStyle(row);
    const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = stage.clientHeight * 0.82; // the top fifth stays void for the inhale to rise into
    let best = null;
    for (const layout of LAYOUTS) {
      const ls = lines(layout);
      let w = 0;
      for (const l of ls) { meas.textContent = l; w = Math.max(w, meas.getBoundingClientRect().width); }
      const fs = Math.min((W / w) * 100 * 0.985, (H - ls.length) / (ls.length * PEAK.lh));
      if (!best || fs > best.fs) best = { fs, ls };
    }
    document.documentElement.style.setProperty('--fs', best.fs.toFixed(2) + 'px');
    if (best.ls.join('/') !== key) {
      key = best.ls.join('/');
      phrase.textContent = '';
      for (const l of best.ls) {
        const r = document.createElement('span'), w = document.createElement('span');
        r.className = 'row'; r.setAttribute('aria-hidden', 'true'); w.textContent = l;
        r.appendChild(w); phrase.appendChild(r);
      }
    }
    spans = [...phrase.querySelectorAll('.row span')];
  }

  function step(dt) {
    const a = HAND_W * HAND_W * (s.hand - s.load) - 2 * HAND_W * s.vel;
    s.vel += a * dt;
    s.load = Math.min(1, Math.max(0, s.load + s.vel * dt));
    s.y += (s.aim - s.y) * (1 - Math.exp(-dt / 0.6));
    s.t *= Math.exp((-dt * (1 + s.load)) / RELEASE);
    const before = Math.floor(s.phase);
    s.phase += (dt * (1 - HAND_TEMPO * s.load)) / lerp(P_RESONANT, P_CLENCHED, s.t);
    if (Math.floor(s.phase) > before) s.breaths++;
    s.frame++;
  }

  function apply(wdth, track, lh, b) {
    const st = phrase.style;
    st.setProperty('--wdth', wdth.toFixed(2));
    st.setProperty('--track', track.toFixed(4));
    st.setProperty('--lh', lh.toFixed(4));
    stage.style.setProperty('--b', b.toFixed(4));
  }

  function paint() {
    const t = s.t;
    const depth = 0.35 + 0.65 * (1 - t);  // clenched breath is shallow
    const r = 0.4 + 0.1 * t;              // inhale share: 50/50 clenched, 40/60 at baseline
    const u = s.phase % 1;
    const inhale = u < r;
    const b = (inhale ? ease(u / r) : 1 - ease((u - r) / (1 - r))) * depth;
    apply(lerp(108, 62, t) + b * 17, lerp(-0.04, -0.06, t) + b * 0.035, lerp(0.86, 0.78, t) + b * 0.1, b);
    const n = spans.length;
    for (let i = 0; i < n; i++) {
      const d = ((i + 0.5) / n - s.y) / 0.3;
      const g = Math.exp(-d * d);
      spans[i].style.setProperty('--sink', (s.load * g).toFixed(4));
    }
    const hz = (1 - HAND_TEMPO * s.load) / lerp(P_RESONANT, P_CLENCHED, t);
    const state = t > 0.6 ? 'CLENCHED' : t > 0.15 ? 'RELEASING' : 'UNCLENCHED';
    put(out.breath, pad(s.breaths, 3));
    put(out.phase, (inhale ? 'Inhale ' : 'Exhale ') + pad(Math.round((inhale ? u / r : (u - r) / (1 - r)) * 99), 2));
    put(out.load, s.load.toFixed(2));
    put(out.frame, pad(s.frame, 6));
    put(out.ticker, `[STATE: ${state} // FREQ: ${hz.toFixed(2)}Hz]`);
  }

  function still() {
    apply(REST.wdth, REST.track, REST.lh, 0);
    for (const sp of spans) sp.style.setProperty('--sink', '0');
    put(out.breath, '--'); put(out.phase, 'Rest'); put(out.load, '0.00'); put(out.frame, 'Still');
    put(out.ticker, '[STATE: UNCLENCHED // FREQ: 0.16Hz]');
  }

  let raf = 0, last = 0;
  const loop = (now) => {
    step(last ? Math.min(0.1, (now - last) / 1000) : 1 / 60);
    last = now; paint(); raf = requestAnimationFrame(loop);
  };
  const rm = matchMedia('(prefers-reduced-motion: reduce)');
  const mode = () => {
    if (window.SOMA_MANUAL) return;
    cancelAnimationFrame(raf); raf = 0; last = 0;
    if (rm.matches) { s.hand = 0; still(); } else raf = requestAnimationFrame(loop);
  };
  rm.addEventListener('change', mode);

  // A hand: hover, touch or Space. It lands heavy, slows the breath, and sinks the rows beneath it.
  const aim = (e) => {
    const r = phrase.getBoundingClientRect();
    s.aim = Math.min(1.2, Math.max(-0.2, (e.clientY - r.top) / r.height));
  };
  stage.addEventListener('pointerenter', (e) => { if (!rm.matches) { s.hand = 1; aim(e); } });
  stage.addEventListener('pointerdown', (e) => {
    if (rm.matches) return;
    stage.focus({ preventScroll: true }); s.hand = 1; aim(e);
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointerup', (e) => {
    s.hand = 0;
    if (stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);
  });
  stage.addEventListener('lostpointercapture', () => { s.hand = 0; });
  stage.addEventListener('pointermove', aim);
  stage.addEventListener('pointerleave', () => { s.hand = 0; });
  stage.addEventListener('pointercancel', () => { s.hand = 0; });
  stage.addEventListener('keydown', (e) => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault(); if (!rm.matches) { s.hand = 1; s.aim = 0.5; }
  });
  stage.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') s.hand = 0; });
  stage.addEventListener('blur', () => { s.hand = 0; });

  window.SOMA = { step, paint, fit, state: s };
  new ResizeObserver(() => { fit(); if (rm.matches) still(); }).observe(stage);
  const boot = () => { fit(); rm.matches ? still() : paint(); mode(); };
  document.fonts.load('900 100px "Archivo WL"').then(boot, boot);
})();
</script>
</body></html>
