  border-radius: 0;
  padding: 8px 13px;

.draw:active,
.export:active {
  background-color: var(--color-primary);

.export:focus-visible,

  width: 100%;
  height: 100%;
  cursor: pointer;
  user-select: none;
  color: var(--art);

  container-type: inline-size;
  transition: none;
}
.turn {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.flip {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform var(--turn) cubic-bezier(0.618, 0, 0.382, 1);
}
.turn:checked + .flip {
  transform: rotateY(180deg);
}
.back,
.face {
  position: absolute;
  inset: 0;
  display: block;
  border: 3px solid var(--art);
  background-color: var(--color-secondary);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transition: visibility 0s calc(var(--turn) / 2);
}
.back svg,
.face svg {
  display: block;
  width: 100%;
  height: 100%;
}
.face {
  transform: rotateY(180deg);
  visibility: hidden;
}
.turn:checked + .flip .face {
  visibility: visible;
}
.turn:checked + .flip .back {
  visibility: hidden;
}
.card.heavy-draw:active {
  transform: scale(0.98);
}

  <main class="grid-fibonacci">

    <section class="reading-frame" aria-labelledby="mirror">
      <header>
        <h1 id="mirror">Architectural Mirror</h1>
        <div class="spread-controls" hidden><label class="spread-size">Cards <select aria-label="Number of cards" class="card-count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><button class="draw" type="button">Shuffle</button></div>
      </header>
      <p class="reading-status" role="status" aria-live="polite">Choose one to four cards. Take a breath and bring a question to mind. Shuffle, stop, then deal.</p>
<div class="shuffle-deck" hidden aria-hidden="true"><svg viewBox="0 0 233 377"><use href="#back"/></svg></div>
<ol class="card-grid" hidden>
        <li><label class="card heavy-draw"><input class="turn" type="checkbox" aria-label="Turn card 1"><span class="flip"><span class="back"><svg viewBox="0 0 233 377"><use href="#back"/></svg></span><span class="face"><svg viewBox="0 0 233 377"><use href="#m16"/></svg><span class="symbol">THE TOWER</span></span></span></label></li>
        <li><label class="card heavy-draw"><input class="turn" type="checkbox" aria-label="Turn card 2"><span class="flip"><span class="back"><svg viewBox="0 0 233 377"><use href="#back"/></svg></span><span class="face"><svg viewBox="0 0 233 377"><use href="#p04"/></svg><span class="symbol">FOUR OF PENTACLES</span></span></span></label></li>
        <li><label class="card heavy-draw"><input class="turn" type="checkbox" aria-label="Turn card 3"><span class="flip"><span class="back"><svg viewBox="0 0 233 377"><use href="#back"/></svg></span><span class="face"><svg viewBox="0 0 233 377"><use href="#w14"/></svg><span class="symbol">KING OF WANDS</span></span></span></label></li>
        <li><label class="card heavy-draw"><input class="turn" type="checkbox" aria-label="Turn card 4"><span class="flip"><span class="back"><svg viewBox="0 0 233 377"><use href="#back"/></svg></span><span class="face"><svg viewBox="0 0 233 377"><use href="#m10"/></svg><span class="symbol">WHEEL OF FORTUNE</span></span></span></label></li>
      </ol>
    </section>

    <section class="journal-frame" aria-labelledby="log">
      <header>
        <h2 id="log">Log</h2>
        <button class="export" type="button" hidden>Export</button>
      </header>
      <textarea class="raw-input" aria-labelledby="log" spellcheck="false"></textarea>
    </section>

  </main>
  <script>(() => {
  const DECK = [["m00","THE FOOL"],["m01","THE MAGICIAN"],["m02","THE HIGH PRIESTESS"],["m03","THE EMPRESS"],["m04","THE EMPEROR"],["m05","THE HIEROPHANT"],["m06","THE LOVERS"],["m07","THE CHARIOT"],["m08","STRENGTH"],["m09","THE HERMIT"],["m10","WHEEL OF FORTUNE"],["m11","JUSTICE"],["m12","THE HANGED MAN"],["m13","DEATH"],["m14","TEMPERANCE"],["m15","THE DEVIL"],["m16","THE TOWER"],["m17","THE STAR"],["m18","THE MOON"],["m19","THE SUN"],["m20","JUDGEMENT"],["m21","THE WORLD"],["w01","ACE OF WANDS"],["w02","TWO OF WANDS"],["w03","THREE OF WANDS"],["w04","FOUR OF WANDS"],["w05","FIVE OF WANDS"],["w06","SIX OF WANDS"],["w07","SEVEN OF WANDS"],["w08","EIGHT OF WANDS"],["w09","NINE OF WANDS"],["w10","TEN OF WANDS"],["w11","PAGE OF WANDS"],["w12","KNIGHT OF WANDS"],["w13","QUEEN OF WANDS"],["w14","KING OF WANDS"],["c01","ACE OF CUPS"],["c02","TWO OF CUPS"],["c03","THREE OF CUPS"],["c04","FOUR OF CUPS"],["c05","FIVE OF CUPS"],["c06","SIX OF CUPS"],["c07","SEVEN OF CUPS"],["c08","EIGHT OF CUPS"],["c09","NINE OF CUPS"],["c10","TEN OF CUPS"],["c11","PAGE OF CUPS"],["c12","KNIGHT OF CUPS"],["c13","QUEEN OF CUPS"],["c14","KING OF CUPS"],["s01","ACE OF SWORDS"],["s02","TWO OF SWORDS"],["s03","THREE OF SWORDS"],["s04","FOUR OF SWORDS"],["s05","FIVE OF SWORDS"],["s06","SIX OF SWORDS"],["s07","SEVEN OF SWORDS"],["s08","EIGHT OF SWORDS"],["s09","NINE OF SWORDS"],["s10","TEN OF SWORDS"],["s11","PAGE OF SWORDS"],["s12","KNIGHT OF SWORDS"],["s13","QUEEN OF SWORDS"],["s14","KING OF SWORDS"],["p01","ACE OF PENTACLES"],["p02","TWO OF PENTACLES"],["p03","THREE OF PENTACLES"],["p04","FOUR OF PENTACLES"],["p05","FIVE OF PENTACLES"],["p06","SIX OF PENTACLES"],["p07","SEVEN OF PENTACLES"],["p08","EIGHT OF PENTACLES"],["p09","NINE OF PENTACLES"],["p10","TEN OF PENTACLES"],["p11","PAGE OF PENTACLES"],["p12","KNIGHT OF PENTACLES"],["p13","QUEEN OF PENTACLES"],["p14","KING OF PENTACLES"]];
  const KEY = 'quiet-creek-tarot.v1';
  const cards = [...document.querySelectorAll('.card')];
  const grid = document.querySelector('.card-grid');
  const log = document.querySelector('.raw-input');
  const draw = document.querySelector('.draw');
  const out = document.querySelector('.export');
  const count = document.querySelector('.card-count');
  const status = document.querySelector('.reading-status');
  const stack = document.querySelector('.shuffle-deck');
  const validSpread = a => Array.isArray(a) && a.length <= 4 && new Set(a).size === a.length && a.every(i => Number.isInteger(i) && i >= 0 && i < DECK.length);
  const validRecord = r => r && typeof r.at === 'string' && !isNaN(Date.parse(r.at)) && typeof r.text === 'string' && validSpread(r.spread);
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
  if (!validRecord(st)) st = {at:new Date().toISOString(),spread:[],turned:[],text:'',past:[]};
  st.past = Array.isArray(st.past) ? st.past.filter(validRecord).slice(-610) : [];
  st.turned = Array.isArray(st.turned) ? st.spread.map((_,i) => !!st.turned[i]) : st.spread.map(() => false);
  count.value = String(Number.isInteger(st.count) && st.count >= 1 && st.count <= 4 ? st.count : (st.spread.length || 1));
  st.count = Number(count.value);
  let phase = 'ready', timer = null, pending = null, breatheIn = true;
  const save = () => { try { localStorage.setItem(KEY,JSON.stringify(st)); } catch (_) {} };
  const randomBelow = n => {
    const limit = 4294967296 - (4294967296 % n); let v;
    do { v = crypto.getRandomValues(new Uint32Array(1))[0]; } while (v >= limit);
    return v % n;
  };
  const shuffled = () => {
    const a = DECK.map((_,i) => i);
    for(let i=a.length-1;i>0;i--){const j=randomBelow(i+1);[a[i],a[j]]=[a[j],a[i]];}
    return a;
  };
  const paint = () => {
    const visible = Number(count.value);
    grid.className = 'card-grid cards-' + visible;
    grid.hidden = phase !== 'ready';
    cards.forEach((c,i) => {
      c.parentElement.hidden = i >= visible;
      const turn = c.querySelector('.turn');
      turn.disabled = i >= st.spread.length;
      if(i >= st.spread.length) { turn.checked = false; return; }
      const card = DECK[st.spread[i]];
      c.querySelector('.face use').setAttribute('href','#'+card[0]);
      c.querySelector('.symbol').textContent=card[1];
      turn.checked=!!st.turned[i];
      turn.setAttribute('aria-label',`Turn card ${i+1}`);
    });
  };
  count.addEventListener('change', () => {
    st.count = Number(count.value);
    paint(); save();
    const n = st.count;
    status.textContent = phase === 'stopped'
      ? `${n === 1 ? 'One card' : n + ' cards'} selected. Hold your question and deal when you’re ready.`
      : `${n === 1 ? 'One card' : n + ' cards'} selected. Take a breath, bring a question to mind, then shuffle.`;
  });
  paint(); log.value=st.text; save();
  if(st.spread.length) status.textContent='Take a breath and hold your question. Turn any card when you’re ready.';
  cards.forEach((c,i) => c.querySelector('.turn').addEventListener('change',e => {st.turned[i]=e.target.checked;save();}));
  log.addEventListener('input',() => {st.text=log.value;save();});
  draw.addEventListener('click',() => {
    if(phase==='ready'){
      pending=shuffled();phase='shuffling';count.disabled=true;
      draw.textContent='Stop';grid.hidden=true;stack.hidden=false;
      stack.classList.add('is-shuffling');breatheIn=true;status.textContent='Breathe in. Bring a question to mind. Stop whenever you’re ready.';
      timer=setInterval(() => {breatheIn=!breatheIn;status.textContent=breatheIn?'Breathe in. Hold your question gently.':'Breathe out. Let your question settle.';},4000);
    } else if(phase==='shuffling'){
      clearInterval(timer);timer=null;phase='stopped';count.disabled=false;
      // Finalize the deck at the moment the reader stops.
      pending=shuffled();stack.classList.remove('is-shuffling');draw.textContent='Deal';
      status.textContent='The deck is still. Hold your question and deal when you’re ready.';
    } else {
      if(st.text.trim()) st.past.push({at:st.at,spread:st.spread.slice(0, st.count),text:st.text});
      st.past=st.past.slice(-610);
      const n=Math.max(1,Math.min(4,Number(count.value)||1));
      Object.assign(st,{at:new Date().toISOString(),spread:pending.slice(0,n),count:n,turned:Array(n).fill(false),text:''});
      log.value='';pending=null;phase='ready';stack.hidden=true;draw.textContent='Shuffle';paint();save();
      status.textContent=`${n===1?'One card':n+' cards'} dealt. Turn ${n===1?'it':'any card'} when you’re ready.`;
    }
  });
  out.addEventListener('click',() => {
    const all=[...st.past,{...st,spread:st.spread.slice(0,st.count)}].filter(r=>r.text.trim());
    const txt=all.map(r=>`${new Date(r.at).toLocaleString()}\n${r.spread.map(n=>DECK[n][1]).join(' / ')}\n\n${r.text.trim()}\n`).join('\n---\n\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='quiet-creek-tarot-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0);
  });
  document.querySelector('.spread-controls').hidden=false;out.hidden=false;
})();
</script>
